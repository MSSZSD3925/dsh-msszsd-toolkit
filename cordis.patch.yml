# dsh-msszsd-toolkit —— QQ 远程驾驶 + 跨会话提问 + 界面暂停按钮 + 重启 DSH（含重启后自动续跑）+ 贵时段纪律
#
# 配置是分组的：qq / session_ask / pause / restart / peak 各自对应 lib/<模块>.js 里的 Config。
# 键必须与 schema 完全一致：多一个键严格校验就让插件加载失败，而失败只写在启动
# DSH 的终端里，现象是「装好了但一点反应都没有」。改 schema 时同步改这里。
- insert:
    - id: dsh-msszsd-toolkit
      name: dsh-msszsd-toolkit
      config:
        qq:
          enabled: true
          ws_url: 'ws://127.0.0.1:3001'
          transport: 'onebot'
          access_token: ''
          allow_users: []
          prefix: '#'
          default_session: ''
          aliases: []
          list_limit: 12
          route_ttl_secs: 1800
          reply_chunk_size: 4000
          forward_merge: true
          forward_name: 'DSH'
          forward_pull_min_chars: 1000
          inbound_media: true
          media_dir: ''
          sticker_dir: ''
          bind_token: ''
          slots_enabled: true
          bill_script: ''
          bill_auto: true
          silence_notice: true
          hint: ''
          napcat_path: ''
          start_wait_secs: 90
          dsh_exe: ''
          pair_link_autosend: false
          pair_link_address: ''
          link_proxy_port: 62566
          link_public_host: ''
          approval_remote: true
          approval_timeout_secs: 300
          questions_remote: true
          question_timeout_secs: 1800
          progress_secs: 0
        session_ask:
          enabled: true
          timeout_secs: 120
          approval_mode: first
          list_limit: 40
          grants_path: ''
          log_path: ''
          context_guard: true
          context_confirm_ratio: 0.5
          compress_threshold_ratio: 0.75
          full_access: allow
        restart:
          enabled: true
          task_name: 'DSH Restart Now'
          default_delay_secs: 20
          min_delay_secs: 5
          resume_max: 2
          resume_ttl_secs: 900
        peak:
          enabled: true
          utc_offset_hours: 8
          morning: '9-12'
          afternoon: '14-18'
        session_watch:
          enabled: true
          dir: ''
          scan_on_start: true
          interval_secs: 900
          max_age_days: 14
          tail_bytes: 4194304
          max_rows: 8
          open_command: ''
